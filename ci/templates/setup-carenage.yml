spec:
  inputs:
    lifetime:
      default: "5"
      description: "Defines the lifetime for the evaluated device, in years"
    location:
      default: EEE
      description: "Defines the location for the evaluation, to determinate the energy mix used"
    project_name:
      default: $CI_PROJECT_NAME
      description: "Defines the name of the evaluated project"
    database:
      default: postgresql://carenage@postgres:5432/carenage
      description: "Defines the URL for the database connection"
---

variables:
  FF_NETWORK_PER_BUILD: true
  POSTGRES_INIT_SCRIPT: "db/1_init_carenage.sql"
  POSTGRES_DB: carenage
  POSTGRES_USER: carenage
  POSTGRES_HOST_AUTH_METHOD: trust
  BOAVIZTAPI_ENDPOINT: http://boaviztapi:5000
  CARENAGE_PROJECT_ID: 58830056
  BOAGENT_URL: http://boagent:8000
  HARDWARE_FILE_PATH: "/home/boagent/hardware_data.json"
  POWER_FILE_PATH: "/app/data/power_data.json"
  LOCATION: $[[ inputs.location ]]
  LIFETIME: $[[ inputs.lifetime ]]
  PROJECT_NAME: $[[ inputs.project_name ]]
  DATABASE_URL: $[[ inputs.database ]]

default:
  services:
    - postgres
    - hubblo/scaphandre:latest
    - ghcr.io/boavizta/boaviztapi:1.2.2
    - ghcr.io/boavizta/boagent:0.1.1

  before_script:
    - apt update && apt install curl unzip postgresql -y
    - psql -h "postgres" -U "${POSTGRES_USER}" -d "${POSTGRES_DB}" -f ${POSTGRES_INIT_SCRIPT}
    - >- 
      curl 
      --location
      --output carenage.zip 
      "https://gitlab.com/api/v4/projects/${CARENAGE_PROJECT_ID}/jobs/artifacts/ci-add-build-carenage-job/download?job=debian-amd64-package"
    - unzip carenage.zip
    - dpkg -i carenage/*.deb
