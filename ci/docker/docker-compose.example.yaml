name: carenage

services:

  gitlab-runner:
    image: gitlab/gitlab-runner:latest
    restart: always
    volumes:
      - gitlab-runner-config:/etc/gitlab-runner
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - carenage
  
  postgres:
    image: postgres:16-bookworm
    restart: always
    ports: 
      - "5432:5432"
    volumes:
      - ../../db:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_USER: carenage
      POSTGRES_DB: carenage
      POSTGRES_PASSWORD: password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - carenage

  boagent:
    image: ghcr.io/boavizta/boagent:0.1.1
    environment:
      BOAVIZTAPI_ENDPOINT: "http://boaviztapi:5000"
      DEFAULT_LIFETIME: 5.0
      HARDWARE_FILE_PATH: "/home/boagent/hardware_data.json"
      POWER_FILE_PATH: "/app/data/power_data.json"
    privileged: true
    depends_on:
      - boaviztapi
      - scaphandre
    ports:
      - "8000:8000"
    networks:
      - carenage 
    volumes:
      - "/proc:/proc"
      - "/sys:/sys:ro"
      - "powerdata:/app/data:ro"

  scaphandre:
    image: hubblo/scaphandre:dev
    privileged: true
    volumes:
      - type: bind
        source: /proc
        target: /proc
      - type: bind
        source: /sys/class/powercap
        target: /sys/class/powercap
      - "powerdata:/app/data:rw"
    command: [ "--no-header", "json", "-s", "10", "--resources", "-f", "/app/data/power_data.json" ]
    networks:
      - carenage 

  boaviztapi:
    image: ghcr.io/boavizta/boaviztapi:1.2.2
    ports:
      - "5000:5000"
    networks:
      - carenage 

volumes:
  powerdata: {}
  gitlab-runner-config:

networks:
  carenage:
    name: carenage
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.33.0/24
