stages:
  - test
  - build-and-test
  - release

include:
  - template: Jobs/SAST.gitlab-ci.yml

semgrep-sast:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev")
      exists:
        - '**/*.rs'

test-for-merge-request:
  stage: test
  image: rust:1.79.0-slim-bullseye
  services:
    - name: postgres
      alias: dbtest
  variables:
    DATABASE_CARGO_FILEPATH: database/Cargo.toml
    API_CARGO_FILEPATH: api/Cargo.toml
    DAEMON_CARGO_FILEPATH: carenaged/Cargo.toml
    POSTGRES_DB: test_carenage
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
    DATABASE_URL: postgresql://test_user:test_password@dbtest:5432/test_carenage
    BOAGENT_URL: http://boagent:8000
    PROJECT_NAME: carenage_webapp
    LOCATION: FRA
    LIFETIME: 5
  script:
    - apt update && apt install -y pkg-config libssl-dev
    - cd carenage
    - cargo test --verbose --manifest-path $DATABASE_CARGO_FILEPATH
    - cargo test --verbose --manifest-path $DAEMON_CARGO_FILEPATH -- --test-threads=1
    - cargo test --verbose --manifest-path $API_CARGO_FILEPATH

  rules:
      - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev")
      - if: $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

dashboard-test-for-merge-request:
  stage: test
  image: node:lts-slim
  script:
    - cd dashboard
    - npm ci
    - npm run test
  rules:
      - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev")
      - if: $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

test-dashboard-e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.49.1-noble
  ## Some tests are flaky with webkit (Safari / Safari Mobile). Allowing failure for now until the problem is properly identified.
  allow_failure: true
  script:
    - cd dashboard
    - npm ci
    - npx playwright test --retries=2
  rules:
      - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev")
      - if: $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build-carenage-and-test:
  stage: build-and-test
  image: rust:1.79.0-slim-bullseye
  services: 
    - name: postgres
      alias: dbtest
  variables:
    POSTGRES_DB: test_carenage
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
    DATABASE_URL: postgresql://test_user:test_password@dbtest:5432/test_carenage
    BOAGENT_URL: http://boagent:8000
    PROJECT_NAME: carenage_webapp
    LOCATION: FRA
    LIFETIME: 5
  before_script:
    - apt update && apt install -y make postgresql
    - export PGPASSWORD=$POSTGRES_PASSWORD
    - psql -h "dbtest" -U "$POSTGRES_USER" -d "$POSTGRES_DB" -f db/1_init_carenage.sql
  script:
    - cd carenage
    - make build_release 
    - make install_release
    - RUST_LOG="info" carenage start &
    - sleep 10
    - carenage stop
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "dev")

debian-amd64-package:
  stage: release 
  image: rust:1.79.0-slim-bullseye
  script:
    - apt update && apt install -y pkg-config libssl-dev debhelper python3-pip
    - pip3 install s3cmd
    - cd carenage/packaging
    - dpkg-buildpackage -b
    - export SHA256SUM=$(sha256sum carenage*.deb) && echo $SHA256SUM
    - echo $SHA256SUM > sha256sums
    - s3cmd --access_key="$S3_ACCESS_KEY" --secret_key="$S3_SECRET_KEY" --region="fr-par" --acl-public --host="s3.fr-par.scw.cloud" --host-bucket="%(bucket).s3.fr-par.scw.cloud" --storage-class="ONEZONE_IA" put carenage*.deb sha256sums s3://carenage/amd64/$CI_COMMIT_TAG/
  rules:
      - if: $CI_COMMIT_TAG

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Releasing v$CI_COMMIT_TAG for Carenage!"
  release:
    tag_name: $CI_COMMIT_TAG
    name: 'Release v$CI_COMMIT_TAG'
    description: 'Latest release for Carenage.'
    assets:
      links:
        - name: 'deb-amd64'
          url: 'https://carenage.s3.fr-par.scw.cloud/amd64/$CI_COMMIT_TAG/carenage_$CI_COMMIT_TAG-1_amd64.deb'
          filepath: '/packages/deb-amd64'
          link_type: 'package'
